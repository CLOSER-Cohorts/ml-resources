server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

volumes:
  - ../logs:/logs

scrape_configs:
  - job_name: my_app_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: my_app
          __path__: /logs/*.json