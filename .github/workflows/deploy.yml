# Note that due to VPN issues the deployment to Windows staging server 
# stage won't work if this process is not run from a self-hosted runner 
# within our VPN
name: Deploy FastAPI (No Docker)

on:
  push:
    branches:
      - main

jobs:

  test-and-deploy:

    runs-on: ubuntu-latest
    
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest

